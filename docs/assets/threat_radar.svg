<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="140">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1017" />
      <stop offset="100%" stop-color="#111923" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#4C8DFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#35C98A" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      @keyframes scanBeam {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateX(880px); opacity: 0; }
      }

      @keyframes alertFlash1 {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.3; }
      }
      @keyframes alertFlash2 {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.95; }
      }
      @keyframes alertFlash3 {
        0%, 70%, 100% { opacity: 0.4; }
        35% { opacity: 1; }
      }
      @keyframes waveScroll {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 120; }
      }

      .scanner { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .alert-red { animation: alertFlash1 2.2s infinite ease-in-out; }
      .alert-amber { animation: alertFlash2 2.8s infinite ease-in-out; }
      .alert-cyan { animation: alertFlash3 3.4s infinite ease-in-out; }
      .wave-wire { stroke-dasharray: 6 4; animation: waveScroll 2.5s linear infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="880" height="140" rx="8" fill="url(#cardBg)" stroke="#1E2B3A" stroke-width="1.5" />

  <!-- Scanning Sweep Line -->
  <g class="scanner">
    <line x1="0" y1="0" x2="0" y2="140" stroke="url(#scanlineGrad)" stroke-width="2.5" />
    <rect x="-30" y="0" width="30" height="140" fill="url(#scanlineGrad)" opacity="0.15" />
  </g>

  <!-- Title & Section Header -->
  <g transform="translate(20, 26)">
    <circle cx="6" cy="6" r="4" fill="#4C8DFF" />
    <text x="18" y="10" fill="#FFFFFF" font-size="12" font-weight="700" class="sans" letter-spacing="0.5">REAL-TIME DETERMINISTIC DETECTION PIPELINE</text>
    <text x="380" y="10" fill="#5E738C" font-size="11" class="mono">STATUS: <tspan fill="#35C98A">ACTIVE (10 RULES EVALUATING)</tspan></text>
  </g>

  <!-- Detection Cards Grid -->
  <g transform="translate(20, 48)">
    <!-- Card 1: Port Scan -->
    <g class="alert-red">
      <rect x="0" y="0" width="195" height="74" rx="6" fill="#180F12" stroke="#4D1D24" stroke-width="1.2" />
      <circle cx="16" cy="18" r="4" fill="#FF4C4C" />
      <text x="26" y="22" fill="#FF7B72" font-size="10.5" font-weight="700" class="mono">RULE-01-PORT-SCAN</text>
      <text x="12" y="42" fill="#DDE4ED" font-size="11" font-weight="600" class="sans">SYN Sweep Detected</text>
      <text x="12" y="60" fill="#8EA1B8" font-size="9.5" class="mono">192.168.1.45 ➔ 24 ports</text>
    </g>

    <!-- Card 2: DNS DGA Entropy -->
    <g transform="translate(212, 0)" class="alert-amber">
      <rect x="0" y="0" width="195" height="74" rx="6" fill="#19150C" stroke="#4D3B16" stroke-width="1.2" />
      <circle cx="16" cy="18" r="4" fill="#D29922" />
      <text x="26" y="22" fill="#E3B341" font-size="10.5" font-weight="700" class="mono">RULE-04-SUSP-DNS</text>
      <text x="12" y="42" fill="#DDE4ED" font-size="11" font-weight="600" class="sans">High Shannon Entropy</text>
      <text x="12" y="60" fill="#8EA1B8" font-size="9.5" class="mono">Entropy: 4.18 | DGA Beacon</text>
    </g>

    <!-- Card 3: Honeypot Trigger -->
    <g transform="translate(424, 0)" class="alert-cyan">
      <rect x="0" y="0" width="195" height="74" rx="6" fill="#0C1420" stroke="#1B3857" stroke-width="1.2" />
      <circle cx="16" cy="18" r="4" fill="#4C8DFF" />
      <text x="26" y="22" fill="#58A6FF" font-size="10.5" font-weight="700" class="mono">RULE-08-HONEYPOT</text>
      <text x="12" y="42" fill="#DDE4ED" font-size="11" font-weight="600" class="sans">Decoy Interaction</text>
      <text x="12" y="60" fill="#8EA1B8" font-size="9.5" class="mono">Port 8080 ➔ GET /.env</text>
    </g>

    <!-- Card 4: Gateway Baseline Verified -->
    <g transform="translate(636, 0)">
      <rect x="0" y="0" width="204" height="74" rx="6" fill="#0C1B14" stroke="#164A2F" stroke-width="1.2" />
      <circle cx="16" cy="18" r="4" fill="#35C98A" />
      <text x="26" y="22" fill="#35C98A" font-size="10.5" font-weight="700" class="mono">RULE-05-GATEWAY</text>
      <text x="12" y="42" fill="#DDE4ED" font-size="11" font-weight="600" class="sans">Gateway MAC Verified</text>
      <text x="12" y="60" fill="#8EA1B8" font-size="9.5" class="mono">192.168.1.1 ➔ Unaltered</text>
    </g>
  </g>
</svg>
