<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Shield Silhouette -->
  <rect width="512" height="512" rx="104" fill="#0B0F14" />
  
  <!-- Outer Shield Border -->
  <path d="M 256 64 L 400 128 C 400 280 256 424 256 424 C 256 424 112 280 112 128 Z" 
        fill="#10161E" 
        stroke="#293342" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner Sentinel Shield Core -->
  <path d="M 256 104 L 368 152 C 368 272 256 384 256 384 C 256 384 144 272 144 152 Z" 
        fill="#151D27" 
        stroke="#4C8DFF" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Network Interconnect Mesh Lines -->
  <line x1="256" y1="180" x2="200" y2="240" stroke="#293342" stroke-width="6" />
  <line x1="256" y1="180" x2="312" y2="240" stroke="#293342" stroke-width="6" />
  <line x1="200" y1="240" x2="256" y2="300" stroke="#45C6D8" stroke-width="6" />
  <line x1="312" y1="240" x2="256" y2="300" stroke="#45C6D8" stroke-width="6" />
  <line x1="200" y1="240" x2="312" y2="240" stroke="#4C8DFF" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Network Nodes -->
  <!-- Top Node -->
  <circle cx="256" cy="180" r="14" fill="#151D27" stroke="#4C8DFF" stroke-width="6" />
  <circle cx="256" cy="180" r="5" fill="#4C8DFF" />

  <!-- Left Node -->
  <circle cx="200" cy="240" r="12" fill="#151D27" stroke="#45C6D8" stroke-width="5" />
  <circle cx="200" cy="240" r="4" fill="#45C6D8" />

  <!-- Right Node -->
  <circle cx="312" cy="240" r="12" fill="#151D27" stroke="#45C6D8" stroke-width="5" />
  <circle cx="312" cy="240" r="4" fill="#45C6D8" />

  <!-- Central Sentinel Core (The Sentry Eye) -->
  <polygon points="256,220 274,240 256,260 238,240" fill="#35C98A" stroke="#F3F6FA" stroke-width="3" />

  <!-- Bottom Terminal Node -->
  <circle cx="256" cy="300" r="14" fill="#151D27" stroke="#4C8DFF" stroke-width="6" />
  <circle cx="256" cy="300" r="5" fill="#4C8DFF" />

  <!-- Subtle Accent Target Reticles -->
  <path d="M 230 148 L 256 136 L 282 148" fill="none" stroke="#A8B3C2" stroke-width="4" stroke-linecap="round" />
  <path d="M 240 348 L 256 358 L 272 348" fill="none" stroke="#45C6D8" stroke-width="4" stroke-linecap="round" />
</svg>
